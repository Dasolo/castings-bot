services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - casting_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  listener-tg:
    build:
      context: .
      dockerfile: listener-tg/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./sessions:/app/sessions
    depends_on:
      db:
        condition: service_healthy
    networks:
      - casting_internal

  parser-tg:
    build:
      context: .
      dockerfile: parser-tg/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - casting_internal

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - casting_internal
      - default

volumes:
  postgres_data:

networks:
  casting_internal:
    driver: bridge
